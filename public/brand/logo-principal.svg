  ARQUIVO PROVISORIO (D-01, D-02) - aproximacao vetorial tracada automaticamente
  a partir de img/logo.png, que permanece a fonte oficial do logo da It's Garlic.
  Este SVG NAO substitui img/logo.png e deve ser trocado quando um vetor
  profissional for entregue pelo cliente - basta sobrescrever este arquivo no
  mesmo caminho, sem alterar nenhum import de componente.
  Variante: principal (fundo preto, lettering branco, icone verde-limao). Gerado por scripts/vectorize-logo.mjs (rode
  novamente para regenerar a partir do arquivo fonte).
-->
