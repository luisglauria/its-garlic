<!--
  ARQUIVO PROVISORIO (D-03, D-04) - composicao ilustrada provisoria que ocupa o lugar da
  fotografia real de produto ate o cliente enviar fotos do pao de alho recheado. Nao e uma
  fotografia: e uma composicao vetorial no estilo da marca (fundo escuro, blocos diagonais em
  verde-limao e roxo, ilustracao de alho em line-art reaproveitando o path do icone de
  public/brand/logo-icone.svg). Sera substituido por sobrescrita deste mesmo caminho quando a
  foto real chegar - nenhum import de componente muda (ver src/components/home/Hero.tsx).
-->
